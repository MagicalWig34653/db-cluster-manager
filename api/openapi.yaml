openapi: 3.1.0
info:
  title: cluster-manager API
  version: 1.0.0
  description: >-
    Versioned manager API (prototype). Without an auth configuration the
    manager serves only /health and /version. With auth enabled it adds
    first-run setup, passkey login, sessions, recovery and authorized
    read-only resource listings. State is held in memory only; resource
    endpoints are backed by interfaces without real stores yet.


    Security: sessions are opaque tokens in HttpOnly, SameSite=Strict,
    Path=/ cookies (Secure with the __Host- prefix unless every configured
    origin is http://localhost). Every POST must carry an Origin header that
    exactly matches a configured passkey origin, and Sec-Fetch-Site, when
    present, must be same-origin; otherwise 403 origin_rejected.
    Unauthenticated failures return generic error codes only. Every state
    change writes an audit record first; if it cannot be stored the request
    is denied with 503.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
paths:
  /provision/plans:
    post:
      summary: Preflight SSH hosts and store a sealed provisioning plan
      description: Experimental, disabled by default. Requires global settings operate permission. Checks Linux, free ports, synchronized time, at least 10 GiB free disk and no existing Swarm or k3s membership. Private keys and known_hosts are sealed and never returned. No host is changed.
      operationId: createProvisionPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionPlanInput' }
      responses:
        '201':
          description: Reviewed plan, digest and exportable scripts without secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionPlan' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /provision/plans/{id}/execute:
    post:
      summary: Queue a reviewed Swarm provision operation
      description: Requires global settings operate permission and the exact plan digest. Every host step waits for a second approval of the operation definition digest through the existing operation approval endpoint. Kubernetes execution is disabled.
      operationId: executeProvisionPlan
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digest]
              properties:
                digest: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '202':
          description: Queued operation reference; approve its definition digest separately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationRef' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /kubernetes-clusters:
    get:
      summary: List experimental Kubernetes registrations (W10, fakes only)
      description: Requires read on global kubernetes_cluster; disabled by default. No cluster contact.
      operationId: listKubernetesRegistrations
      responses:
        "200":
          description: Credential-free registration metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KubernetesRegistration" }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
        "503": { description: Feature disabled or sealed store unavailable }
    post:
      summary: Register an existing Kubernetes cluster (metadata only)
      description: Requires create on global kubernetes_cluster and same-origin CSRF checks. Exactly one token or opaque kubeconfig is sealed; never returned or executed. No connectivity validation.
      operationId: registerKubernetesCluster
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KubernetesRegistrationInput" }
      responses:
        "201":
          description: Registered without contacting a cluster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesRegistration" }
        "400": { description: Invalid registration }
        "401": { description: Authentication required }
        "403": { description: Permission denied or Origin rejected }
        "409": { description: Registration ID exists }
        "503": { description: Feature disabled, audit or sealed store unavailable }
  /health:
    get:
      summary: Liveness of the manager process
      description: Reports only that this process serves requests, not cluster or storage health.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is serving requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /version:
    get:
      summary: Build information of the manager
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema:
                type: object
                required: [component, version, commit, goVersion, platform]
                properties:
                  component: { type: string }
                  version: { type: string }
                  commit: { type: string }
                  goVersion: { type: string }
                  platform: { type: string }
  /setup/status:
    get:
      summary: Whether first-run setup is still possible
      description: >-
        True until the first administrator exists and while the one-time
        setup token printed at manager start is active.
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired]
                properties:
                  setupRequired: { type: boolean }
  /setup/begin:
    post:
      summary: Start creating the first administrator with a passkey
      description: >-
        Requires the setup token. Sets a short-lived ceremony cookie that
        binds the passkey ceremony to this browser. Setup-token guesses are
        rate limited per client IP.
      operationId: beginSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setupToken, accountId]
              properties:
                setupToken: { type: string }
                accountId: { $ref: "#/components/schemas/AccountId" }
                displayName: { type: string, maxLength: 128 }
                passkeyLabel: { type: string, maxLength: 64 }
      responses:
        "200": { $ref: "#/components/responses/Challenge" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /setup/finish:
    post:
      summary: Finish creating the first administrator
      description: >-
        Verifies the passkey, binds the administrator role globally, enrols a
        recovery-code set, disables setup permanently and starts a session.
        The recovery codes are returned exactly once.
      operationId: finishSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CeremonyFinish"
                - type: object
                  required: [setupToken]
                  properties:
                    setupToken: { type: string }
      responses:
        "201":
          description: Administrator created; session cookie set
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [accountId, recoveryCodes]
                properties:
                  accountId: { type: string }
                  recoveryCodes:
                    type: [array, "null"]
                    items: { type: string }
                    description: Null only if code enrolment failed; codes can be generated later.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/login/begin:
    post:
      summary: Start a discoverable passkey login
      description: No account name is sent, so the response cannot reveal whether an account exists.
      operationId: beginLogin
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Challenge" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/login/finish:
    post:
      summary: Finish a passkey login and start a session
      operationId: finishLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CeremonyFinish" }
      responses:
        "200":
          description: Signed in; session cookie set
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [accountId]
                properties:
                  accountId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: End the current session
      description: >-
        Accepts a full or a recovery session. The session ends even if the
        audit record cannot be stored (refusing would keep a credential
        alive); that failure is logged.
      operationId: logout
      responses:
        "204": { description: Signed out; cookies cleared }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/session:
    get:
      summary: Describe the current session
      operationId: getSession
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                type: object
                required: [accountId, restricted, pendingPasskeyEnrollment, createdAt]
                properties:
                  accountId: { type: string }
                  restricted:
                    type: boolean
                    description: Recovery session that only allows passkey re-enrolment.
                  pendingPasskeyEnrollment: { type: boolean }
                  createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
  /auth/passkeys/begin:
    post:
      summary: Start registering a passkey on the caller's own account
      description: Accepts a full session or a recovery session.
      operationId: beginPasskeyRegistration
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, maxLength: 64 }
      responses:
        "200": { $ref: "#/components/responses/Challenge" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/passkeys/finish:
    post:
      summary: Finish registering a passkey
      description: >-
        The credential change ends every session of the account; a fresh full
        session cookie is set. After a recovery this completes re-enrolment.
      operationId: finishPasskeyRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CeremonyFinish" }
      responses:
        "201":
          description: Passkey registered; new session cookie set
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [passkey]
                properties:
                  passkey: { $ref: "#/components/schemas/PasskeyInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/recovery/code:
    post:
      summary: Redeem a recovery code
      description: >-
        On success the account's passkeys are removed, every session ends and
        a short recovery session cookie is set that only allows registering a
        new passkey. Attempts are limited per client IP and account. Every
        failure returns the same 401 body.
      operationId: redeemRecoveryCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, code]
              properties:
                accountId: { type: string }
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/RecoveryStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/recovery/token:
    post:
      summary: Redeem a single-use recovery URL token
      description: Same behaviour as /auth/recovery/code; tokens are issued through the manager CLI.
      operationId: redeemRecoveryToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, token]
              properties:
                accountId: { type: string }
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/RecoveryStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /swarms:
    get:
      summary: List Swarms the caller may read
      operationId: listSwarms
      responses:
        "200":
          description: Swarms visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Swarm" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Connect a Swarm
      description: >-
        Records the connection; nothing is contacted until a sync. dockerHost
        is unix:///path or tcp://host:port (tcp without TLS is lab-only).
        Needs Swarm create permission; audited.
      operationId: connectSwarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, dockerHost]
              properties:
                name: { type: string, maxLength: 64 }
                dockerHost: { type: string, maxLength: 256 }
      responses:
        "201":
          description: Connected (state unknown until observed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Swarm" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clusters:
    get:
      summary: List database clusters the caller may read
      operationId: listClusters
      responses:
        "200":
          description: Clusters visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Cluster" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a MariaDB Galera cluster
      description: >-
        Plans placement and starts the creation operation; the response is the
        operation. Needs cluster create permission in the Swarm; audited.
        Coarse 409 codes: no_capacity, policy_conflict, settings_incomplete,
        cluster_exists. 503 not_leader when this replica cannot run commands.
      operationId: createCluster
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClusterRequest" }
      responses:
        "202":
          description: Operation started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationRef" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clusters/{id}:
    get:
      summary: Get one database cluster
      description: A cluster the caller may not read is reported as 404, like a missing one.
      operationId: getCluster
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The cluster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a cluster (also discards a failed create)
      description: >-
        Plans and starts a cluster/delete operation and answers with its
        approval digest; nothing is removed until POST
        /operations/{id}/approve with that digest. The operation removes, through
        the agents and their ownership allow-list, only objects the installation
        created for the cluster: each node's database service (by name and
        cluster label; missing counts as removed), job services of backups that
        did not finish, inspection instances of the cluster not torn down with
        their manager-created init secrets, and each node volume after its
        identity marker was verified (a volume never created, or without marker
        and without any file, counts as removed). Operator-provided networks and
        secrets are never removed; the host directory of a local volume and the
        backups in the backend are kept. On success the cluster record and its
        backup policy are deleted, which releases the name and the planned
        capacity. Failed operations of the cluster are aborted first; an
        unfinished one answers 409 busy (abort it first). Needs the delete
        permission on the cluster (administrator preset only; denied by default
        for every other preset); audited.
      operationId: deleteCluster
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "202":
          description: Deletion planned; waits for the approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterDeletion" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /operations:
    get:
      summary: List operations the caller may read
      description: >-
        An operation needs read on its cluster, else on its Swarm, else (manager-level)
        read on settings.
      operationId: listOperations
      responses:
        "200":
          description: Operations visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /events:
    get:
      summary: List events the caller may read
      description: Located and filtered like operations.
      operationId: listEvents
      responses:
        "200":
          description: Events visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /dashboards:
    get:
      summary: List dashboards the caller may see
      description: >-
        Returns the caller's personal dashboards and all shared dashboards,
        provided the caller holds dashboard read permission. Sharing grants
        viewing of the definition only; the data shown by a panel is always
        filtered by the viewer's own permissions (see /metrics/query).
      operationId: listDashboards
      responses:
        "200":
          description: Dashboards visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /dashboards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
    post:
      summary: Create a dashboard with the given ID
      description: >-
        Requires dashboard create permission; audited. The caller becomes the
        owner. Responds 409 if the ID exists.
      operationId: createDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace a dashboard the caller owns
      description: >-
        Requires dashboard update permission; audited. Dashboards of other
        owners, shared or not, answer 404.
      operationId: updateDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a dashboard the caller owns
      description: Requires dashboard delete permission; audited.
      operationId: deleteDashboard
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /metrics/query:
    post:
      summary: Range query over metrics the caller may read
      description: >-
        Evaluates a selector over [start, end] at the given step. Only series
        the caller may read are considered (cluster series need cluster read,
        host series host read, swarm series swarm read, everything else
        settings read). Every series has exactly one point per step; a point
        is ok, no_data (readable, empty) or unavailable (expired by
        retention, unreadable, or not answerable). Unavailable intervals are
        also listed in gaps. Missing data is never reported as zero.
        Metric history lives on the active manager's disk (leader only).
      operationId: queryMetrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selector, start, end, stepSeconds]
              properties:
                selector:
                  type: string
                  maxLength: 1024
                  description: 'Metric name with optional matchers, for example dcm_galera_cluster_size{cluster="c1"}.'
                start: { type: integer, format: int64, description: Milliseconds since the Unix epoch }
                end: { type: integer, format: int64, description: Milliseconds since the Unix epoch }
                stepSeconds: { type: integer, minimum: 1 }
                windowSeconds: { type: integer, minimum: 0, description: Aggregation window; default is the step }
                func: { type: string, enum: [last, avg, min, max, sum, count, rate, quantile], default: last }
                quantile: { type: number, minimum: 0, maximum: 1 }
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      summary: List UI inbox notifications the caller may read
      description: Located and filtered like events. Newest first.
      operationId: listNotifications
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Notifications visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /notifications/{id}/ack:
    post:
      summary: Acknowledge a notification
      description: >-
        Requires the operate permission on the resource the notification
        refers to (cluster, else Swarm, else manager settings); audited.
      operationId: ackNotification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Acknowledged }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /notifications/{id}/read:
    post:
      summary: Mark a notification read
      description: >-
        Needs read permission on the notification's resource only (the read
        flag is presentation state, shared by all users of the leader's
        inbox). Not audited.
      operationId: markNotificationRead
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Marked read }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /hosts:
    get:
      summary: List inventoried Swarm nodes the caller may read
      description: Needs host read permission in the host's Swarm. Absent values are unknown.
      operationId: listHosts
      responses:
        "200":
          description: Hosts visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /hosts/{id}/enroll:
    post:
      summary: Enroll a discovered host
      description: >-
        The host may then run the manager-deployed agent (labels are applied by
        POST /swarms/{id}/agents/deploy). id is the Swarm node ID; an ID that
        exists in two Swarms answers 409. Needs host update permission;
        audited. A caller who may not read the host gets 404.
      operationId: enrollHost
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: The updated host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /hosts/{id}/revoke:
    post:
      summary: Revoke a host's enrollment
      description: >-
        Marks the host revoked and revokes its agent certificate. Like enroll:
        host update permission, audited.
      operationId: revokeHost
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: The updated host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /hosts/{id}/maintenance-plan:
    get:
      summary: Preview the maintenance plan of a host
      description: >-
        Read-only. For every cluster with a node on the host: the steps that
        entering maintenance (or, with end=true, leaving it) would run, their
        conditions, warnings, and why a cluster refuses (fewer than a strict
        majority of its nodes outside the host, an unfinished operation, a
        missing service ID). Needs host read permission (404 when denied).
      operationId: hostMaintenancePlan
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: end, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenancePreview" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /hosts/{id}/maintenance:
    post:
      summary: Put a host into guided maintenance
      description: >-
        Marks the host in maintenance (node replacement on it is paused) and
        starts, per cluster with a node on the host, an operation that stops
        those nodes gracefully one at a time, each only after every node of
        the cluster on another host is Synced at the current cluster size.
        Refused with 409 (and nothing changed) when any affected cluster
        refuses (see the plan preview) or the host is already in
        maintenance. The manager never reboots or drains the host and does
        not change its Swarm availability; Host.maintenance.ready reports
        when the operator may do so. Needs operate permission on the host
        and on every affected cluster; audited.
      operationId: enterHostMaintenance
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: End the maintenance of a host
      description: >-
        Starts, per affected cluster, an operation that checks each node's
        volume identity marker, starts the node and waits until it is Synced
        (IST or SST), one node at a time, and clears the maintenance mark.
        409 when the host is not in maintenance or an operation of an
        affected cluster is unfinished. Needs operate permission on the host
        and the clusters; audited.
      operationId: leaveHostMaintenance
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceStarted" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /swarms/{id}/sync:
    post:
      summary: Observe a Swarm now
      description: Updates the Swarm and host inventory. Needs Swarm operate permission; audited.
      operationId: syncSwarm
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Observed (the Swarm may now be reported unavailable) }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /swarms/{id}/agents/deploy:
    post:
      summary: Deploy the agent service and apply enrollment labels
      description: >-
        Creates the installation's agent global service if missing and sets or
        removes the enrollment label per host record. Needs Swarm operate
        permission; audited. settings_incomplete (409) when installation ID,
        volume base or agent image are not configured.
      operationId: deployAgents
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Deployment result
          content:
            application/json:
              schema:
                type: object
                required: [created, labeled, unlabeled, failed]
                properties:
                  serviceId: { type: string }
                  created: { type: boolean }
                  labeled: { type: array, items: { type: string } }
                  unlabeled: { type: array, items: { type: string } }
                  failed: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clusters/{id}/operation-plan:
    post:
      operationId: planClusterOperation
      summary: Store an approval-gated Galera scale, rolling restart or patch upgrade plan
      description: >-
        Needs cluster operate permission (also for approval), audited. Persists
        the plan and digest; no agent command runs before digest approval via
        POST /operations/{id}/approve. Abort before requesting another plan.
        Fresh Synced evidence in one Primary component is required. Live gates
        recheck every stop. Major or series upgrades return
        major_upgrade_requires_product_approval; product approval and a curated
        upgrade path are required. Host maintenance remains a separate flow.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClusterOperationInput' }
      responses:
        '202':
          description: Stored plan waiting for approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterOperationPlan' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /clusters/{id}/nodes/{slot}/replace:
    post:
      summary: Replace a failed node
      description: >-
        Plans and starts a replacement under the quorum rules of
        galera.PlanReplacement. When quorum or a verified donor is not observed
        on fresh data the request is refused with 409 requires_guided_recovery
        and nothing starts; there is no override. busy (409) while another
        operation on the cluster is unfinished. Needs cluster operate
        permission; audited.
      operationId: replaceNode
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: slot
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202":
          description: Operation started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationRef" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clusters/{id}/drift:
    get:
      summary: Compare a cluster's desired state with its Swarm services
      description: >-
        Lists the Swarm services labelled with the cluster (read-only Docker
        API call) and reports differences from the cluster record: missing
        node services, services recreated outside the manager, foreign
        labels, changed placement, nodes scaled to 0 or without a running
        task outside maintenance and operations, and unexpected services with
        the cluster label. Each finding proposes a manual action; nothing is
        changed. The leader also checks periodically and records an event
        when the findings change. Needs cluster read permission (404 when
        denied); settings_incomplete (409) without a Swarm connector.
      operationId: clusterDrift
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Drift report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clusters/{id}/outage-diagnosis:
    get:
      summary: Diagnose a full outage (read-only)
      description: >-
        Reads every node's grastate.dat through its agent (read-only command)
        and adds the last collected health observation, then evaluates the
        recovery evidence. Nothing is started; requires_approval is always
        true. Needs cluster read permission; a cluster the caller may not read
        answers 404. 409 conflict when a Primary component exists.
      operationId: outageDiagnosis
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Diagnosis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnosis" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Diagnose a full outage after recovering crashed nodes' positions
      description: >-
        Like GET, and additionally runs mariadbd --wsrep-recover (agent
        command wsrep-recover, a one-off container without network on the
        node's host, as the database user) on every node whose grastate.dat
        has no saved seqno (-1 after a crash), so their positions become
        known. This performs InnoDB crash recovery on the stopped node's data,
        as any start would; it starts no database service, changes no
        service spec and never bootstraps. Refused (409) while a node was last
        seen in a Primary component; the agent refuses while a container on
        the host mounts the volume. Needs operate permission; audited. Body:
        empty object or none.
      operationId: outageDiagnosisRecover
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Diagnosis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnosis" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clusters/{id}/outage-recovery:
    post:
      summary: Request the guided full-outage recovery (waits for approval)
      description: >-
        Collects the evidence again (including mariadbd --wsrep-recover on
        nodes without a saved seqno, as POST /clusters/{id}/outage-diagnosis)
        and diagnoses; refuses with 409 conflict
        when the fresh diagnosis proposes no candidate or a candidate other
        than the confirmed one, when a Primary component exists or another
        operation of the cluster is unfinished. Otherwise stores the guided
        recovery plan (stop every node, wait until no task runs, verify every
        identity marker, re-check the candidate's grastate position and set
        safe_to_bootstrap, bootstrap the candidate, start the other nodes one
        at a time, drop the bootstrap flag) as an operation whose first stop
        waits for POST /operations/{id}/approve with the returned digest.
        Nothing is stopped or started before that approval. Requesting needs
        operate permission on the cluster; approving needs the separate
        recover permission on the cluster. Both are audited.
      operationId: outageRecovery
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate]
              properties:
                candidate: { type: string, description: The slot the diagnosis proposed }
      responses:
        "202":
          description: Recovery operation waiting for approval
          content:
            application/json:
              schema:
                type: object
                required: [id, kind, candidate, approval, diagnosis]
                properties:
                  id: { type: string }
                  kind: { type: string }
                  candidate: { type: string }
                  approval: { $ref: "#/components/schemas/OperationApproval" }
                  diagnosis: { $ref: "#/components/schemas/Diagnosis" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /operations/{id}/resume:
    post:
      summary: Resume a paused or adopted operation
      description: Needs operate permission on the operation's cluster (else Swarm, else settings); audited.
      operationId: resumeOperation
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "202":
          description: Resume requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationRef" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /operations/{id}/abort:
    post:
      summary: Abort an operation at a safe step boundary
      description: Like resume. A step that is running blocks the abort (409).
      operationId: abortOperation
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "202":
          description: Abort requested or recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationRef" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /operations/{id}/approve:
    post:
      summary: Approve the destructive steps of an operation
      description: >-
        Only operations that carry an approval (Operation.approval) can be
        approved. digest must equal approval.digest, the SHA-256 of the stored
        operation definition, so an approval covers exactly the plan that was
        shown; a different digest answers 409 approval_mismatch. Needs the
        restore permission on the backups of the operation's cluster
        (administrators; not part of the operator preset), and for a
        cluster/delete operation the delete permission on the cluster instead,
        for a galera/full-outage-recovery operation the recover permission on
        the cluster (only the administrator preset holds it; neither operate
        nor restore covers it), and for a service/create or service/delete
        operation the create or delete permission on the service resource in
        the Swarm; audited. The operation is resumed after the approval is recorded.
      operationId: approveOperation
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digest]
              properties:
                digest: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Approval recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationApproval" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /services:
    get:
      summary: List managed services the caller may read
      description: >-
        Services of a service type (container, traefik, galera, sftp, ftp,
        s3, nfs) with their observed health. Galera clusters are listed as
        galera services and need cluster read permission. Implemented with
        fakes only (W07, W09).
      operationId: listServices
      responses:
        "200":
          description: Services visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Request a managed service
      description: >-
        Validates the spec, plans, stores an operation whose steps wait for an
        approval bound to the digest of the planned definition, and starts it.
        Approve with POST /operations/{id}/approve. A plan with blockers
        (published ports, configuration delivery: the agent cannot do them
        yet) is refused with 409 conflict; preview it with POST
        /services/plan. Needs service create permission in the Swarm; audited.
        Type galera runs the unchanged cluster creation (same plan and
        operation as POST /clusters, cluster create permission, no approval
        step; approval.digest is empty). Coarse 409 codes: conflict,
        settings_incomplete, cluster_exists (name used), busy, no_capacity,
        policy_conflict. 503 not_leader.
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "202":
          description: Operation started, waiting for approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /services/plan:
    post:
      summary: Preview the plan of a service request
      description: >-
        Read-only plan preview: ordered steps, the generated artifacts (Swarm
        service, rendered Traefik YAML; never secret values), warnings and
        blockers, and the expert view (agentSteps: the exact agent commands
        with provisional IDs). Changes nothing. format=yaml exports the same
        document as YAML. Needs service create permission in the Swarm
        (galera: cluster create).
      operationId: previewService
      parameters:
        - { $ref: "#/components/parameters/PlanFormat" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePlan" }
            application/yaml:
              schema: { $ref: "#/components/schemas/ServicePlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /services/{id}:
    get:
      summary: Get one managed service
      operationId: getService
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Request the deletion of a managed service
      description: >-
        Plans the removal and stores an operation whose removals wait for an
        approval bound to the digest of the definition. The body may set
        removeVolumes; by default managed volumes and their data are kept.
        Needs service delete permission (administrators); audited. When the
        operation succeeds the service record is removed.
      operationId: deleteService
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceDeleteInput" }
      responses:
        "202":
          description: Operation started, waiting for approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /services/{id}/delete-plan:
    get:
      summary: Preview the deletion plan of a managed service
      description: >-
        Read-only, with the expert view. Query removeVolumes=true includes the
        volume removals; format=yaml exports as YAML. A galera service shows
        the cluster deletion plan (needs cluster delete permission).
      operationId: previewServiceDelete
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: removeVolumes, in: query, required: false, schema: { type: boolean } }
        - { $ref: "#/components/parameters/PlanFormat" }
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePlan" }
            application/yaml:
              schema: { $ref: "#/components/schemas/ServicePlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /services/{id}/update-plan:
    post:
      summary: Preview the update (or rollback) plan of a managed service
      description: >-
        Read-only: update-service with the Swarm update strategy,
        await-service, and the service-healthy gate, plus the prepared
        rollback plan and the expert view. What the agent's update-service
        cannot change (replicas, placement, volumes) is a blocker. format=yaml
        exports as YAML. Needs service update permission. galera answers 409
        conflict: its nodes are updated through the cluster flows.
      operationId: previewServiceUpdate
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/PlanFormat" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceUpdateInput" }
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePlan" }
            application/yaml:
              schema: { $ref: "#/components/schemas/ServicePlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /services/{id}/update:
    post:
      summary: Request an update (or rollback) of a managed service
      description: >-
        Stores an operation whose steps wait for an approval bound to the
        digest of the definition (approve with POST /operations/{id}/approve,
        service update permission). The stored spec changes only after the
        operation succeeded; the old spec becomes the rollback target. A
        failed update keeps the stored spec (Swarm may have rolled back or
        paused). Needs service update permission; audited. 409 busy while
        another operation of the service runs.
      operationId: updateService
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceUpdateInput" }
      responses:
        "202":
          description: Operation started, waiting for approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /backups:
    get:
      summary: Backup state per cluster
      description: Needs backup read permission on the cluster. Absent times are unknown, never "none".
      operationId: listBackups
      responses:
        "200":
          description: Backup summaries visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BackupSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clusters/{id}/backup-policy:
    put:
      summary: Set a cluster's backup schedule
      description: >-
        Scheduled backups are started by the leading manager (physical method,
        missed-run policy skip or run-once). Needs backup update permission on
        the cluster; audited.
      operationId: setBackupPolicy
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupPolicy" }
      responses:
        "200":
          description: Stored policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clusters/{id}/backups:
    post:
      summary: Start a backup now
      description: >-
        Plans the backup (source node selection, owned one-shot job per
        object) and starts it: physical (mariabackup, default) or, with
        method logical, one mariadb-dump export per named database. Needs
        the backup permission on the cluster; audited. settings_incomplete
        (409) without backup settings; busy (409) while another operation
        locks the cluster.
      operationId: startBackup
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                method: { type: string, enum: [physical, logical], default: physical }
                databases: { type: array, maxItems: 64, items: { type: string } }
      responses:
        "202":
          description: Operation started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationRef" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /restores/inspect:
    post:
      summary: Start an isolated inspection restore
      description: >-
        Plans a single-node instance with wsrep off on a separate network and
        starts the operation; every destructive step waits for an explicit
        approval (POST /operations/{id}/approve with the returned digest).
        Needs the restore permission on the cluster's backups; audited. The
        inspection account password is returned only in this response. Without
        an explicit host the manager selects one; it answers no_capacity (409)
        when host disk space is not observed. The restore job and the instance
        service are created by the agent on a Swarm manager node (the job pinned
        to the inspection host, whose agent first checks the target volume). The
        operation ends with the restore-verified gate: the instance is probed
        through the agent on its host (status query as the monitoring account,
        which the init file leaves unlocked) and an instance-level verification
        report is recorded (stream digests verified, instance answers, not in a
        Galera component; table contents are not compared). A passed report sets
        lastVerifiedRestoreAt. At expiry the instance, its volume and its init
        secret are removed.
      operationId: startInspection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cluster]
              properties:
                cluster: { type: string }
                backup: { type: string, description: Backup ID; default is the newest completed backup }
                host: { type: string, description: Explicitly approved Swarm node ID }
                keySecret: { type: string, description: Swarm secret with the recovery key; default from settings }
                ttlMinutes: { type: integer, minimum: 0, maximum: 1440 }
      responses:
        "202":
          description: Operation started, waiting for approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /settings/notifications:
    get:
      summary: Notification channel settings
      description: Secrets are never returned; secretSet and passwordSet report whether one is stored. Needs settings read permission.
      operationId: getNotificationSettings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace notification channel settings
      description: >-
        Absent optional fields keep their stored values. secret and password
        are write-only; they are stored encrypted in the replicated store and
        replaced only when sent. Needs settings update permission; audited.
      operationId: setNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Stored settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /settings/notifications/test:
    post:
      summary: Send a test notification through one channel
      description: >-
        Sends a test event through the configured webhook or email channel.
        delivered=false carries no error detail (see the server log). Needs
        settings operate permission; audited. settings_incomplete (409) when
        the channel is not enabled.
      operationId: testNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel]
              properties:
                channel: { type: string, enum: [webhook, email] }
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema:
                type: object
                required: [channel, delivered]
                properties:
                  channel: { type: string }
                  delivered: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /settings/data-key/rotate:
    post:
      operationId: rotateDataKey
      summary: Preview or approve replicated data-key rotation (global administrator only)
      description: Empty digest previews; resubmit the returned revision-bound digest for explicit approval. Old envelopes remain for historical recovery. Re-encryption resumes on the leader.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                digest: {type: string}
      responses:
        '200':
          description: Rotation preview or started rotation
          content:
            application/json:
              schema:
                type: object
                required: [digest, currentKey, started]
                properties:
                  digest: {type: string}
                  currentKey: {type: string}
                  started: {type: boolean}
        '403': {$ref: '#/components/responses/Error'}
        '409':
          description: Active rotation or stale approval digest
        '503':
          description: Keyring unavailable or not leader

  /settings/replicas/{id}/peer-certificate:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: issueMetastorePeerCertificate
      summary: Provision a peer certificate from a CSR (global administrator only)
      description: Fakes-only opt-in backend; the default manager returns 503. The private peer key never enters the manager. Does not add a voter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address, csr, publicKey]
              properties:
                address: {type: string}
                csr: {type: string}
                publicKey: {type: string}
      responses:
        '200':
          description: Public certificate chain, serial and expiry
          content:
            application/json:
              schema:
                type: object
                required: [certificate, serial, notAfter]
                properties:
                  certificate: {type: string}
                  serial: {type: string}
                  notAfter: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /settings/replicas/{id}/membership:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: changeMetastoreMembership
      summary: Preview or approve one Raft member change (global administrator only)
      description: Empty digest previews. Fakes-only opt-in backend; the default manager returns 503. Serializes changes, stages a nonvoter, requires authenticated catchup evidence, and refuses quorum loss or removal of the current leader. Removal tombstones the peer and revokes recorded certificates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                remove: {type: boolean, default: false}
                digest: {type: string}
      responses:
        '200':
          description: Revision-bound preview or completed membership change
          content:
            application/json:
              schema:
                type: object
                required: [digest, complete]
                properties:
                  digest: {type: string}
                  complete: {type: boolean}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}

  /settings/replicas:
    get:
      summary: Manager replicas and the data keyring
      description: >-
        Lists the metastore voters with the fingerprint of their registered
        public identity and whether the current data key (which seals
        sessions, passkeys and the agent CA at rest) is wrapped for them, and
        whether the key has an envelope for the backup recovery key.
        No key material is returned. Needs settings read permission; read
        decisions are audited only when denied.
      operationId: listReplicas
      responses:
        "200":
          description: Keyring status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyringStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /settings/replicas/{id}/data-key-recipient:
    put:
      summary: Register a replica's public identity and wrap the data key for it
      description: >-
        Registers the public identity a replica prints with
        `manager -print-replica-key` (compare it out of band before
        registering) and wraps every data key for it, so that replica can
        unseal secrets and act as leader. Only current metastore voters can
        be registered (400 otherwise); a changed identity replaces the old
        envelopes. Leader only (503 not_leader elsewhere). Needs settings
        update permission; audited, and recorded as an event.
      operationId: registerReplicaKey
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicKey]
              properties:
                publicKey: { type: string, maxLength: 256, description: "dbcmpk1:<base64url X25519 public key>" }
      responses:
        "200":
          description: Registered replica
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicaKeyStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /settings/replicas/{id}/revoke-certificates:
    post:
      summary: Revoke every manager certificate of a replica
      description: >-
        Adds every unexpired manager certificate (agent-command client and
        enrollment server) recorded for the replica to the replicated deny
        list, for a removed or compromised replica. The leader distributes
        the deny list to every enrolled agent (agent command set-deny-list),
        whose mTLS listener then refuses those certificates; a replica that
        is still in service gets new certificates on next use. It does not
        remove the replica from the metastore or rotate the data key.
        Leader only. Needs settings update permission; audited, and recorded
        as an event. settings_incomplete (409) without the agent transport.
      operationId: revokeReplicaCertificates
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Number of revoked serials
          content:
            application/json:
              schema:
                type: object
                required: [replica, revoked]
                properties:
                  replica: { type: string }
                  revoked: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /image-builds:
    get:
      summary: Recorded image builds (proposal, fakes only)
      description: >-
        Lists build jobs newest first without their logs: spec hash, context
        hash, base image digests, resulting image digest, SBOM placeholder
        (always `not_generated` for now) and status. Needs image_build read
        permission. Not wired into the manager yet (503 unavailable).
      operationId: listImageBuilds
      responses:
        "200":
          description: Build jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImageBuildJob" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Plan an image build, then start it with the plan's approval digest
      description: >-
        Without `approvalDigest` the request is validated and answered with
        the plan (200): the generated Dockerfile, context files, steps,
        warnings and a human-readable explanation. Nothing is built or
        pushed. With `approvalDigest` equal to the `digest` of the reviewed
        plan the build starts and the job is returned (202); a digest that
        does not match the freshly recomputed plan is refused with 409
        approval_mismatch. The base image must be pinned by digest; PHP
        extensions, php.ini settings and packages come from allow-lists and
        the custom nginx snippet is size-limited and checked for dangerous
        directives (400 bad_request otherwise). Needs image_build create
        permission; both the preview and the start are audited as create
        decisions. Fakes only: no image has been built by a real builder.
      operationId: createImageBuild
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageBuildRequest" }
      responses:
        "200":
          description: Plan preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageBuildResult" }
        "202":
          description: Build started (or finished, with the fake builder)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageBuildResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /registries:
    get:
      summary: Configured container registries (proposal, fakes only)
      description: >-
        Lists registries without credentials; `credentialSet` only says that
        one is stored. Needs registry read permission.
      operationId: listRegistries
      responses:
        "200":
          description: Registries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Registry" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Register an external registry
      description: >-
        Registers a GHCR, Docker Hub or generic OCI registry. The service
        checks reachability and the credentials before storing anything; the
        password is stored through the secret store and never returned or
        logged. A rejected credential answers 400. Managed registries are a
        deployment specification only and cannot be registered here. Needs
        registry create permission (administrator preset only); audited.
      operationId: createExternalRegistry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalRegistryInput" }
      responses:
        "201":
          description: Registry registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/findings:
    get:
      summary: Vulnerability findings (proposal, fakes only)
      description: >-
        Deterministic matches of advisories against the inventory, highest
        priority first, with VEX-like status, severity, KEV/EPSS inputs and
        the computed priority. Needs vuln read permission (administrator
        preset only; denied by default).
      operationId: listVulnFindings
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VulnFinding" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/findings/{id}:
    get:
      summary: One vulnerability finding
      operationId: getVulnFinding
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnFinding" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/findings/{id}/status:
    put:
      summary: Record a VEX-like decision on a finding
      description: >-
        not_affected needs a justification. A not_affected or fixed finding
        does not re-alert for the same component version. Needs vuln update;
        audited.
      operationId: setVulnFindingStatus
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VulnStatusInput" }
      responses:
        "200":
          description: Updated finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnFinding" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/findings/{id}/proposals:
    post:
      summary: Request a remediation proposal for a finding
      description: >-
        Without useAi the deterministic proposer runs (patched rebuild to the
        stated fixed version, or no-op). With useAi the policy's provider and
        model analyse the allow-listed, redacted context; the answer is parsed
        against a strict schema and validated against the finding and the
        typed allow-lists. The result is always a proposal with an approvable
        plan and a benefit/risk rating, or a proposal with status invalid and
        the validator's reasons. Nothing is changed. Under auto_for_policy a
        proposal that passes every allow-list rule is approved at once.
        Needs vuln operate; audited. 409 settings_incomplete when the
        provider has no consent, 409 busy when its daily limit is reached.
      operationId: proposeVulnRemediation
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                useAi: { type: boolean }
      responses:
        "201":
          description: Proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnProposal" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/proposals:
    get:
      summary: Remediation proposals, newest first
      operationId: listVulnProposals
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VulnProposal" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/proposals/{id}/approve:
    post:
      summary: Approve the plan with this digest
      description: >-
        The plan is recomputed from the current finding and inventory; the
        digest must match both the shown plan and the recomputed one (409
        approval_mismatch otherwise). notify_only refuses approval (409
        policy_conflict). Invalid, declined or already decided proposals
        answer 409 conflict. The approved plan goes to the executor (image
        build service; rollout is not automated). Needs vuln update; audited.
      operationId: approveVulnProposal
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digest]
              properties:
                digest: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Approved proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnProposal" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/proposals/{id}/decline:
    post:
      summary: Decline a proposal
      operationId: declineVulnProposal
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Declined proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnProposal" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/feeds:
    get:
      summary: Advisory feed polling state
      description: >-
        Per feed: last attempt and success, coarse error class, failures,
        backoff and whether the feed is stale (no success for 24 h).
      operationId: listVulnFeeds
      responses:
        "200":
          description: Feed states
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VulnFeedState" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/poll:
    post:
      summary: Poll the due feeds and match now
      description: >-
        Leader only (503 not_leader on a follower). Failing feeds are backed
        off; the others still run. Needs vuln operate; audited.
      operationId: pollVulnFeeds
      responses:
        "200":
          description: Poll report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnPollReport" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/policy:
    get:
      summary: Vulnerability response policy and its version
      operationId: getVulnPolicy
      responses:
        "200":
          description: Policy (notify_only when none is stored)
          content:
            application/json:
              schema:
                type: object
                required: [policy, version]
                properties:
                  policy: { $ref: "#/components/schemas/VulnPolicy" }
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace the policy
      description: >-
        Conditional on version (0 when none is stored; 409 conflict when it
        changed). auto_for_policy needs non-empty severities, named services
        (no wildcard), kinds (patched_rebuild, mitigation) and maxPerDay
        1..20; the caller is recorded as opt-in. A selected provider must
        exist and allow the model. Needs vuln update; audited.
      operationId: setVulnPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy, version]
              properties:
                policy: { $ref: "#/components/schemas/VulnPolicy" }
                version: { type: integer }
      responses:
        "200":
          description: Stored policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/providers:
    get:
      summary: AI providers (no secrets)
      description: >-
        Provider configurations with credentialSet, local (data stays in the
        host network), the egress statement to consent to, consent and the
        current day's usage.
      operationId: listVulnProviders
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VulnProvider" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Register an AI provider
      description: >-
        Kinds claude_api, openai_api (API key required), openai_compatible
        (base URL required; plain http only to loopback or private
        addresses), claude_code_cli and codex_cli (experimental: absolute
        binary path and the experimental acknowledgement required, no API
        key). The API key is stored through the secret store and never
        returned or logged. A new provider has no consent. Needs vuln create;
        audited.
      operationId: createVulnProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VulnProviderInput" }
      responses:
        "201":
          description: Provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/providers/{id}/consent:
    put:
      summary: Grant or revoke data-egress consent
      description: >-
        Granting requires the statement to equal the provider's current
        egressStatement (409 approval_mismatch otherwise). Needs vuln update;
        audited.
      operationId: setVulnProviderConsent
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant]
              properties:
                grant: { type: boolean }
                statement: { type: string }
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /vuln/audit:
    get:
      summary: Vulnerability response audit trail
      description: >-
        Every step: polls, findings, analyses (provider, model, prompt and
        response SHA-256), proposals, validator results, approvals, executions,
        policy and provider changes. Prompts and secrets are never recorded.
      operationId: listVulnAudit
      responses:
        "200":
          description: Records in order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VulnAuditRecord" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
security:
  - sessionCookie: []
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    PlanFormat:
      name: format
      in: query
      required: false
      description: Export format of the plan document; json (default) or yaml (application/yaml, same content).
      schema: { type: string, enum: [json, yaml] }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-dcm_session
      description: >-
        Opaque session token. Named dcm_session for http://localhost
        development. Recovery sessions use __Host-dcm_recovery and are only
        accepted by /auth/session, /auth/logout and /auth/passkeys/*.
  headers:
    SessionCookie:
      description: Session cookie (HttpOnly; SameSite=Strict; Path=/; Secure except localhost development)
      schema: { type: string }
  responses:
    Error:
      description: >-
        Error with a coarse code only. Codes: not_found, bad_request,
        authentication_failed, unauthenticated, forbidden,
        passkey_enrollment_required, origin_rejected, rate_limited,
        unavailable, setup_unavailable, internal_error, conflict,
        request_too_large, unsupported_media_type; on command endpoints also
        requires_guided_recovery, no_capacity, policy_conflict,
        settings_incomplete, cluster_exists, busy, approval_mismatch and
        not_leader (503).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts for this client and account
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Challenge:
      description: >-
        Passkey ceremony started; options is the publicKey member for
        navigator.credentials.create/get. Pre-authentication ceremonies set a
        ceremony cookie.
      content:
        application/json:
          schema:
            type: object
            required: [ceremonyId, options, expiresAt]
            properties:
              ceremonyId: { type: string }
              options: { type: object }
              expiresAt: { type: string, format: date-time }
    RecoveryStarted:
      description: Recovery session cookie set; register a new passkey next
      content:
        application/json:
          schema:
            type: object
            required: [pendingPasskeyEnrollment]
            properties:
              pendingPasskeyEnrollment: { type: boolean, enum: [true] }
  schemas:
    ProvisionPlanInput:
      type: object
      required: [id, platform, hosts, credentials]
      properties:
        id: { type: string }
        platform: { type: string, enum: [swarm, kubernetes] }
        hosts:
          type: array
          items:
            type: object
            required: [id, address, user, role]
            properties:
              id: { type: string }
              address: { type: string }
              user: { type: string }
              role: { type: string, enum: [manager, worker] }
        credentials:
          type: object
          description: Host ID to SSH credential; sealed at rest and write-only
          additionalProperties:
            type: object
            required: [privateKey, knownHosts]
            properties:
              privateKey: { type: string, writeOnly: true }
              knownHosts: { type: string, writeOnly: true }
    ProvisionPlan:
      type: object
      required: [id, platform, hosts, checks, steps, digest, scripts]
      properties:
        id: { type: string }
        platform: { type: string, enum: [swarm, kubernetes] }
        hosts: { type: array, items: { type: object } }
        checks: { type: array, items: { type: object } }
        steps: { type: array, items: { type: object } }
        digest: { type: string }
        scripts:
          type: object
          additionalProperties: { type: string }
    ClusterOperationInput:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [scale-out, scale-in, rolling-restart, minor-upgrade]
        slot:
          type: string
          description: New unique slot for scale-out, existing slot for scale-in; forbidden for rolling operations
        image:
          type: string
          description: Required for minor-upgrade only; immutable repository:x.y.z@sha256 digest, increasing patch within the same MariaDB series
    ClusterOperationPlan:
      type: object
      required: [id, kind, approval, plan, agentSteps]
      properties:
        id: { type: string }
        kind: { type: string }
        approval:
          $ref: '#/components/schemas/OperationApproval'
        plan:
          type: object
          description: Ordered Galera steps, resulting cluster, nodes, desired specs and warnings
          additionalProperties: true
        agentSteps:
          type: array
          items:
            type: object
            additionalProperties: true

    KubernetesRegistration:
      type: object
      additionalProperties: false
      required: [id, name, endpoint, namespace, credentialKind, credentialSet]
      properties:
        id: { type: string }
        name: { type: string }
        endpoint: { type: string, format: uri }
        namespace: { type: string }
        credentialKind: { type: string, enum: [token, kubeconfig] }
        credentialSet: { type: boolean }
    KubernetesRegistrationInput:
      type: object
      additionalProperties: false
      required: [id, name, endpoint, namespace]
      properties:
        id: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        endpoint: { type: string, format: uri, description: HTTPS origin without credentials, path, query or fragment }
        namespace: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        token: { type: string, minLength: 1, maxLength: 32768, writeOnly: true }
        kubeconfig: { type: string, minLength: 1, maxLength: 32768, writeOnly: true }
      oneOf:
        - required: [token]
          not: { required: [kubeconfig] }
        - required: [kubeconfig]
          not: { required: [token] }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ReplicaKeyStatus:
      type: object
      required: [id, leader, hasCurrentKey]
      properties:
        id: { type: string }
        address: { type: string }
        leader: { type: boolean }
        publicKeyId: { type: string, description: Fingerprint of the registered public identity }
        registeredBy: { type: string }
        registeredAt: { type: string, format: date-time }
        hasCurrentKey: { type: boolean }
    KeyringStatus:
      type: object
      required: [currentKey, recoverable, replicas]
      properties:
        currentKey: { type: string, description: ID of the current data key (not the key) }
        rotation:
          type: object
          properties:
            from: {type: string}
            to: {type: string}
            processed: {type: integer}
            complete: {type: boolean}
        recoverable: { type: boolean, description: The current key has a backup recovery key envelope }
        replicas:
          type: array
          items: { $ref: "#/components/schemas/ReplicaKeyStatus" }
    AccountId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9._@-]+$"
    CeremonyFinish:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          description: PublicKeyCredential JSON (credential.toJSON()).
    PasskeyInfo:
      type: object
      required: [id, accountId, rpId, createdAt, signCount, backupEligible, backupState]
      properties:
        id: { type: string }
        accountId: { type: string }
        rpId: { type: string }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        signCount: { type: integer }
        backupEligible: { type: boolean }
        backupState: { type: boolean }
        attestationFormat: { type: string }
        cloneWarnings: { type: integer }
        lastCloneWarningAt: { type: string, format: date-time }
    State:
      type: string
      enum: [healthy, degraded, unavailable, unknown]
      description: Observed state. Missing or unrecognized observations are reported as unknown, never as healthy.
    Swarm:
      type: object
      required: [id, name, state]
      properties:
        id: { type: string }
        name: { type: string }
        state: { $ref: "#/components/schemas/State" }
        observedAt: { type: string, format: date-time }
    ClusterNode:
      type: object
      required: [id, state, role]
      properties:
        id: { type: string }
        host: { type: string }
        state: { $ref: "#/components/schemas/State" }
        role:
          type: string
          enum: [synced, donor, joining, joined, initialized, unknown]
          description: Galera role from the last fresh observation; unknown when missing or stale
        observedAt: { type: string, format: date-time, description: Time of the last observation, fresh or not }
    Cluster:
      type: object
      required: [id, swarm, name, state, nodes]
      properties:
        id: { type: string, description: Unique within the manager }
        swarm: { type: string }
        name: { type: string }
        engine: { type: string }
        state: { $ref: "#/components/schemas/State" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ClusterNode" }
        observedAt: { type: string, format: date-time }
        endpoints:
          type: array
          description: Configured client addresses on the cluster network (not a reachability claim); absent means not reported
          items: { $ref: "#/components/schemas/Endpoint" }
        lastBackupAt: { type: string, format: date-time, description: End of the newest successful backup; absent means unknown }
        lastVerifiedRestoreAt: { type: string, format: date-time, description: Newest passed restore verification; absent means unknown }
        automationPolicy: { type: string, enum: [auto-replace, manual] }
    Operation:
      type: object
      required: [id, kind, state]
      properties:
        id: { type: string }
        kind: { type: string }
        swarm: { type: string }
        cluster: { type: string }
        state: { type: string, enum: [pending, running, succeeded, failed, aborted, unknown], description: "aborted: an operator abort ended the operation at a safe boundary; failed: a step failed without an abort" }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        approval: { $ref: "#/components/schemas/OperationApproval" }
        reason: { type: string, description: Short runner status reason, for example an unmet precondition }
        progress: { $ref: "#/components/schemas/OperationProgress" }
    OperationProgress:
      type: object
      description: >-
        Step progress as last stored by the leader (refreshed while a step polls
        its preconditions). step is the first step that has not succeeded.
      required: [stepsDone, stepsTotal]
      properties:
        stepsDone: { type: integer, minimum: 0 }
        stepsTotal: { type: integer, minimum: 0 }
        step: { type: string }
        command: { type: string, description: Agent command kind; empty for a gate }
        target: { type: string, description: Host that receives the command }
        state: { type: string, description: "Journal state of the step (pending, running, failed, unknown)" }
        attempts: { type: integer, minimum: 0 }
        waiting: { type: string, description: Latest unmet precondition or retry reason of the step }
        lastError: { type: string, description: "Latest failed or unanswered attempt of the step as the agent or transport reported it (redacted)" }
        polls: { type: integer, minimum: 0, description: Precondition polls and retries of the step }
        since: { type: string, format: date-time, description: Time of the step's latest timeline entry }
        updatedAt: { type: string, format: date-time }
    ServiceInput:
      type: object
      required: [swarm, name, type, spec]
      properties:
        swarm: { type: string }
        name: { type: string, description: "Lower case letters, digits and hyphens." }
        type: { type: string, enum: [container, traefik, galera, sftp, ftp, s3, nfs] }
        spec:
          type: object
          description: >-
            Type-specific desired state; strict, no secret values. galera: the
            fields of the cluster creation request other than swarm and name
            (size, image, network, rootPasswordSecret, gcacheSize, resources,
            placement, autoReplace).
    ServiceDeleteInput:
      type: object
      properties:
        removeVolumes: { type: boolean }
    ServiceHealth:
      type: object
      required: [state, running, desired]
      description: >-
        Observed from the Swarm task state of the owned service (galera: the
        cluster's wsrep-based state). unknown when not observed or older than
        two minutes; never reported as healthy without an observation.
      properties:
        state: { type: string, enum: [healthy, degraded, unhealthy, unknown, unavailable] }
        reasons: { type: array, items: { type: string } }
        running: { type: integer, minimum: 0 }
        desired: { type: integer, minimum: 0 }
        updateState: { type: string, description: "Swarm UpdateStatus.State (updating, completed, paused, rollback_completed, ...)" }
        observedAt: { type: string, format: date-time }
    ServiceInfo:
      type: object
      required: [id, swarm, name, type, spec]
      properties:
        id: { type: string }
        swarm: { type: string }
        name: { type: string }
        type: { type: string }
        spec: { type: object }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        createOperation: { type: string }
        deleteOperation: { type: string }
        updateOperation: { type: string, description: A running update or rollback }
        rollbackable: { type: boolean, description: "A previous spec is kept for POST /services/{id}/update with rollback" }
        health: { $ref: "#/components/schemas/ServiceHealth" }
    ServiceUpdateStrategy:
      type: object
      description: >-
        Rolling update through the agent's update-service command with a Swarm
        UpdateConfig. Defaults: stop-first, parallelism 1, monitor 30 s,
        onFailure rollback (Swarm restores the previous spec when a new task
        fails within the monitor period). start-first is refused for services
        with local volumes. canary is accepted but not executable yet (the
        plan gets a blocker).
      properties:
        order: { type: string, enum: [stop-first, start-first] }
        parallelism: { type: integer, minimum: 1, maximum: 50 }
        delaySeconds: { type: integer, minimum: 0, maximum: 3600 }
        monitorSeconds: { type: integer, minimum: 0, maximum: 3600 }
        maxFailureRatio: { type: number, minimum: 0, maximum: 1 }
        onFailure: { type: string, enum: [rollback, pause] }
        canary:
          type: object
          required: [replicas]
          properties:
            replicas: { type: integer, minimum: 1 }
            holdSeconds: { type: integer, minimum: 0 }
    ServiceUpdateInput:
      type: object
      required: [strategy]
      description: Either spec (the new desired state) or rollback true (back to the spec before the last successful update), not both.
      properties:
        spec: { type: object }
        strategy: { $ref: "#/components/schemas/ServiceUpdateStrategy" }
        rollback: { type: boolean }
    AgentStep:
      type: object
      required: [id, preconditions]
      description: One exact step of the stored operation (expert view). No command means a gate.
      properties:
        id: { type: string }
        command: { type: string, description: Agent command kind }
        target: { type: string, description: Host ID of the agent that receives the command }
        args: { type: object, description: The command arguments exactly as sent; never secret values }
        preconditions: { type: array, items: { type: string } }
        note: { type: string }
    ServiceArtifact:
      type: object
      required: [name, mediaType, content]
      properties:
        name: { type: string }
        mediaType: { type: string }
        content: { type: string }
        secret: { type: boolean, description: Sensitive artifacts are refused as Swarm configs }
    ServicePlan:
      type: object
      required: [kind, type, name, steps, artifacts, warnings, blockers, executable, requiresApproval, text, agentSteps]
      properties:
        kind: { type: string, enum: [create, delete, update] }
        type: { type: string }
        name: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/PlanStep" } }
        artifacts: { type: array, items: { $ref: "#/components/schemas/ServiceArtifact" } }
        warnings: { type: array, items: { type: string } }
        blockers: { type: array, items: { type: string } }
        executable: { type: boolean }
        requiresApproval:
          type: boolean
          description: >-
            Always true except for a galera create, which starts without an
            approval step exactly like POST /clusters.
        text: { type: string }
        agentSteps:
          type: array
          description: Expert view; empty when the plan has blockers.
          items: { $ref: "#/components/schemas/AgentStep" }
        provisionalIds:
          type: boolean
          description: In a preview the operation, token, approval (and galera cluster) IDs are provisional; a start issues new ones.
        rollback: { $ref: "#/components/schemas/ServicePlan" }
    ServiceStarted:
      type: object
      required: [service, operation, approval, plan]
      properties:
        service: { type: string }
        operation: { $ref: "#/components/schemas/OperationRef" }
        approval: { $ref: "#/components/schemas/OperationApproval" }
        plan: { $ref: "#/components/schemas/ServicePlan" }
    ClusterDeletion:
      type: object
      required: [id, kind, approval]
      properties:
        id: { type: string }
        kind: { type: string, enum: [cluster/delete] }
        approval: { $ref: "#/components/schemas/OperationApproval" }
    Event:
      type: object
      required: [id, time, severity, message]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        swarm: { type: string }
        cluster: { type: string }
        severity: { type: string, enum: [info, warning, critical, unknown] }
        message: { type: string }
    Panel:
      type: object
      required: [id, title, kind, selector, func, stepSeconds, x, y, w, h]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 200 }
        kind: { type: string, enum: [line, stat, table] }
        selector: { type: string }
        func: { type: string, enum: [last, avg, min, max, sum, count, rate, quantile] }
        windowSeconds: { type: integer, minimum: 0 }
        stepSeconds: { type: integer, minimum: 1 }
        quantile: { type: number, minimum: 0, maximum: 1 }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1, maximum: 24 }
        h: { type: integer, minimum: 1 }
    DashboardInput:
      type: object
      additionalProperties: false
      required: [title, panels]
      properties:
        title: { type: string, maxLength: 200 }
        shared: { type: boolean }
        panels:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Panel" }
    Dashboard:
      type: object
      required: [id, title, owner, shared, panels]
      properties:
        id: { type: string }
        title: { type: string }
        owner: { type: string }
        shared: { type: boolean }
        template: { type: boolean }
        panels:
          type: array
          items: { $ref: "#/components/schemas/Panel" }
    QueryResult:
      type: object
      required: [start, end, stepSeconds, windowSeconds, series, gaps]
      properties:
        start: { type: integer, format: int64, description: Aligned start in milliseconds }
        end: { type: integer, format: int64 }
        stepSeconds: { type: integer }
        windowSeconds: { type: integer }
        series:
          type: array
          items:
            type: object
            required: [labels, points]
            properties:
              labels:
                type: object
                additionalProperties: { type: string }
                description: The metric name is returned as label "name".
              points:
                type: array
                items:
                  type: object
                  required: [t, v, state]
                  properties:
                    t: { type: integer, format: int64, description: Milliseconds since the Unix epoch }
                    v: { type: [number, "null"], description: Null unless state is ok }
                    state: { type: string, enum: [ok, no_data, unavailable] }
        gaps:
          type: array
          items:
            type: object
            required: [from, to, reason]
            properties:
              from: { type: integer, format: int64 }
              to: { type: integer, format: int64 }
              reason: { type: string }
    Notification:
      type: object
      required: [id, time, severity, kind, message, read, acked, acknowledged]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        severity: { type: string, enum: [info, warning, error, critical, unknown] }
        kind: { type: string, description: "alert.firing, alert.resolved, alert.unknown or an operation kind" }
        resource: { type: string }
        message: { type: string }
        swarm: { type: string }
        cluster: { type: string }
        details: { type: object, additionalProperties: { type: string } }
        read: { type: boolean }
        acked: { type: boolean }
        acknowledged: { type: boolean, description: Same as acked (UI name) }
        ackedAt: { type: string, format: date-time }
    OperationRef:
      type: object
      required: [id]
      properties:
        id: { type: string }
        kind: { type: string }
    OperationApproval:
      type: object
      required: [digest]
      properties:
        digest: { type: string, description: SHA-256 (hex) of the stored operation definition }
        approvedBy: { type: string }
        approvedAt: { type: string, format: date-time }
    Endpoint:
      type: object
      required: [host, port]
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer }
    Host:
      type: object
      required: [swarm, nodeId, enrollment]
      properties:
        swarm: { type: string }
        nodeId: { type: string, description: Swarm node ID; the host's ID in paths }
        hostname: { type: string }
        role: { type: string }
        availability: { type: string }
        state: { type: string, description: Swarm node state as last observed }
        engineVersion: { type: string }
        enrollment: { type: string, enum: [discovered, enrolled, revoked] }
        spare: { type: boolean }
        nanoCpus: { type: integer, format: int64 }
        memoryBytes: { type: integer, format: int64 }
        observedAt: { type: string, format: date-time }
        agentIdentity: { type: boolean, description: An agent certificate is recorded (not a reachability claim) }
        agentVersion: { type: string, description: Build version the agent reported in its last answer to the manager; absent until the manager has contacted the agent }
        agentSeenAt: { type: string, format: date-time, description: When the manager last received an HTTP answer from the agent (best effort, at most about one write a minute) }
        maintenance:
          type: object
          description: Set while the host is in guided maintenance (replacement on it is paused)
          required: [since, by, operations, ready]
          properties:
            since: { type: string, format: date-time }
            by: { type: string }
            reason: { type: string }
            operations: { type: array, items: { type: string } }
            ready: { type: boolean, description: Every maintenance operation succeeded; the operator may reboot the host }
    PlanStep:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string }
        slot: { type: string }
        note: { type: string }
        conditions: { type: array, items: { type: string } }
    MaintenancePreview:
      type: object
      required: [host, end, safe, clusters]
      properties:
        host: { type: string }
        end: { type: boolean }
        safe: { type: boolean, description: No affected cluster refuses }
        clusters:
          type: array
          items:
            type: object
            required: [cluster, name, slots, steps]
            properties:
              cluster: { type: string }
              name: { type: string }
              slots: { type: array, items: { type: string } }
              steps: { type: array, items: { $ref: "#/components/schemas/PlanStep" } }
              warnings: { type: array, items: { type: string } }
              refused: { type: string, description: Why this cluster cannot lose its nodes on the host now }
    MaintenanceStarted:
      type: object
      required: [host, operations, plan]
      properties:
        host: { type: string }
        operations: { type: array, items: { $ref: "#/components/schemas/OperationRef" } }
        plan: { $ref: "#/components/schemas/MaintenancePreview" }
    DriftReport:
      type: object
      required: [cluster, checkedAt, inSync, findings]
      properties:
        cluster: { type: string }
        checkedAt: { type: string, format: date-time }
        inSync: { type: boolean }
        findings:
          type: array
          items:
            type: object
            required: [kind, detail, action]
            properties:
              kind:
                type: string
                enum: [missing-service, service-replaced-outside, foreign-labels, placement-changed, stopped, not-running, unexpected-service]
              slot: { type: string }
              service: { type: string }
              detail: { type: string }
              action: { type: string, description: Proposed manual next step; nothing is changed automatically }
    ResourceAmount:
      type: object
      properties:
        milli_cpu: { type: integer, format: int64, minimum: 0 }
        memory_bytes: { type: integer, format: int64, minimum: 0 }
    CreateClusterRequest:
      type: object
      additionalProperties: false
      required: [swarm, name, size, image, network, rootPasswordSecret, resources, placement]
      properties:
        swarm: { type: string }
        name: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,46}[a-z0-9])?$" }
        size: { type: integer, enum: [3, 5] }
        image: { type: string, description: MariaDB image, pinned by digest }
        network: { type: string, description: Attachable overlay network }
        rootPasswordSecret: { type: string, description: Name of an existing Swarm secret (never the password) }
        gcacheSize: { type: string }
        resources:
          type: object
          required: [limits, reservations]
          properties:
            limits: { $ref: "#/components/schemas/ResourceAmount" }
            reservations: { $ref: "#/components/schemas/ResourceAmount" }
        placement:
          type: object
          required: [reserve]
          description: Precedence allowlist, exclusion, preference, automatic scoring; allowlisted and excluded together is policy_conflict.
          properties:
            allowlist: { type: array, items: { type: string } }
            excluded: { type: array, items: { type: string } }
            preferred: { type: array, items: { type: string } }
            reserve: { $ref: "#/components/schemas/ResourceAmount" }
        autoReplace: { type: boolean }
    Diagnosis:
      type: object
      required: [positions, reasons, requires_approval]
      properties:
        candidate: { type: string, description: Slot proposed for bootstrap; absent when none can be proposed }
        positions:
          type: array
          items:
            type: object
            required: [slot, seqno, source, safe_to_bootstrap]
            properties:
              slot: { type: string }
              uuid: { type: string }
              seqno: { type: integer, format: int64 }
              source: { type: string }
              safe_to_bootstrap: { type: boolean }
              empty: { type: boolean }
        reasons: { type: array, items: { type: string } }
        risks:
          type: array
          items:
            type: object
            required: [kind, detail]
            properties:
              kind: { type: string }
              slot: { type: string }
              detail: { type: string }
        requires_approval: { type: boolean, enum: [true] }
    BackupPolicy:
      type: object
      additionalProperties: false
      required: [enabled, schedule]
      properties:
        enabled: { type: boolean }
        schedule: { type: string, maxLength: 128, description: "Five-field cron-like spec, for example \"0 2 * * *\"" }
        timezone: { type: string, description: IANA zone; default UTC }
        missed: { type: string, enum: [skip, run-once], default: skip }
        method: { type: string, enum: [physical, logical], default: physical }
        databases:
          type: array
          maxItems: 64
          description: Logical method only (required there); one mariadb-dump export per database
          items: { type: string }
        retention:
          type: object
          additionalProperties: false
          description: >-
            After each scheduler pass, older complete backup sets of the cluster are
            deleted (manifest first, then stream); the newest set, the newest set with a
            passed restore verification and sets used by an open inspection are always
            kept; a cluster with an unfinished operation is skipped for the pass.
          required: [keepLast]
          properties:
            keepLast: { type: integer, minimum: 1, maximum: 1000 }
            keepDaily: { type: integer, minimum: 0, maximum: 1000 }
            keepWeekly: { type: integer, minimum: 0, maximum: 1000 }
    BackupSummary:
      type: object
      required: [cluster, swarm]
      properties:
        cluster: { type: string }
        swarm: { type: string }
        policy: { type: string, description: Schedule spec of an enabled policy }
        backupPolicy: { $ref: "#/components/schemas/BackupPolicy" }
        lastBackupAt: { type: string, format: date-time }
        lastBackupId: { type: string }
        lastVerifiedRestoreAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time }
    InspectionStarted:
      type: object
      required: [id, kind, session, backup, host, service, port, expiresAt, approval, inspectionAccount, inspectionPassword]
      properties:
        id: { type: string, description: Operation ID }
        kind: { type: string }
        session: { type: string }
        backup: { type: string }
        host: { type: string }
        service: { type: string }
        port: { type: integer }
        expiresAt: { type: string, format: date-time }
        approval: { $ref: "#/components/schemas/OperationApproval" }
        inspectionAccount: { type: string }
        inspectionPassword: { type: string, description: Returned only once, here }
    NotificationSettings:
      type: object
      required: [minSeverity, webhook, email]
      properties:
        minSeverity: { type: string, enum: [info, warning, error, critical] }
        webhook:
          type: object
          required: [enabled, secretSet]
          properties:
            enabled: { type: boolean }
            url: { type: string }
            secretSet: { type: boolean }
            allowPrivate: { type: boolean }
        email:
          type: object
          required: [enabled, recipients, passwordSet]
          properties:
            enabled: { type: boolean }
            recipients: { type: array, items: { type: string } }
            addr: { type: string }
            from: { type: string }
            username: { type: string }
            passwordSet: { type: boolean }
    NotificationSettingsInput:
      type: object
      additionalProperties: false
      required: [webhook, email]
      properties:
        minSeverity: { type: string, enum: [info, warning, error, critical] }
        webhook:
          type: object
          additionalProperties: false
          required: [enabled, url]
          properties:
            enabled: { type: boolean }
            url: { type: string, maxLength: 2048 }
            secret: { type: string, writeOnly: true, maxLength: 1024 }
            allowPrivate: { type: boolean }
        email:
          type: object
          additionalProperties: false
          required: [enabled, recipients]
          properties:
            enabled: { type: boolean }
            recipients: { type: array, maxItems: 50, items: { type: string } }
            addr: { type: string, description: "SMTP host:port" }
            from: { type: string }
            username: { type: string }
            password: { type: string, writeOnly: true, maxLength: 1024 }
    ImageBuildRequest:
      type: object
      additionalProperties: false
      required: [spec, target]
      properties:
        spec:
          type: object
          description: Web server composition (nginx, PHP-FPM, extensions, ini, snippet, packages, platforms)
          required: [name, nginx]
          properties:
            name: { type: string }
            nginx:
              type: object
              required: [version, baseDigest]
              properties:
                version: { type: string, example: "1.27" }
                baseDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                options: { type: object }
                customSnippet: { type: string, maxLength: 8192 }
            php:
              type: object
              properties:
                version: { type: string, example: "8.3" }
                extensions: { type: array, items: { type: string } }
                ini: { type: object, additionalProperties: { type: string } }
            extraPackages: { type: array, items: { type: string } }
            platforms: { type: array, items: { type: string, enum: [linux/amd64, linux/arm64] } }
        target:
          type: object
          required: [registry, repository, tag]
          properties:
            registry: { type: string }
            repository: { type: string }
            tag: { type: string }
        approvalDigest: { type: string, description: "Digest of the reviewed plan; starts the build" }
    ImageBuildResult:
      type: object
      properties:
        plan: { $ref: "#/components/schemas/ImageBuildPlan" }
        job: { $ref: "#/components/schemas/ImageBuildJob" }
    ImageBuildPlan:
      type: object
      required: [specHash, contextHash, digest, dockerfile, steps, warnings, explanation]
      properties:
        specHash: { type: string }
        contextHash: { type: string }
        digest: { type: string }
        baseImage: { type: string }
        platforms: { type: array, items: { type: string } }
        target: { type: object }
        reference: { type: string }
        dockerfile: { type: string }
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              mode: { type: integer }
              content: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              order: { type: integer }
              title: { type: string }
              detail: { type: string }
        warnings: { type: array, items: { type: string } }
        explanation: { type: string }
    ImageBuildJob:
      type: object
      required: [id, status, specHash, contextHash, planDigest, reference, sbom]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        spec: { type: object }
        specHash: { type: string }
        contextHash: { type: string }
        planDigest: { type: string }
        reference: { type: string }
        platforms: { type: array, items: { type: string } }
        baseDigests: { type: array, items: { type: string } }
        imageDigest: { type: string }
        sbom:
          type: object
          properties:
            status: { type: string, enum: [not_generated] }
            ref: { type: string }
        error: { type: string, description: Redacted }
        log: { type: string, description: "Redacted build log; omitted in lists" }
        logSize: { type: integer }
        logTruncated: { type: boolean }
        requestedBy: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    Registry:
      type: object
      required: [id, name, kind, credentialSet]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ghcr, dockerhub, generic, managed] }
        endpoint: { type: string }
        username: { type: string }
        credentialSet: { type: boolean }
        createdBy: { type: string }
    ExternalRegistryInput:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" }
        name: { type: string, maxLength: 100 }
        kind: { type: string, enum: [ghcr, dockerhub, generic] }
        endpoint: { type: string, description: "Required for generic; https (http only for loopback)" }
        username: { type: string, maxLength: 512 }
        password: { type: string, writeOnly: true, maxLength: 4096 }
    VulnComponent:
      type: object
      required: [ecosystem, name, version]
      properties:
        ecosystem: { type: string }
        name: { type: string }
        version: { type: string }
        purl: { type: string }
    VulnFinding:
      type: object
      required: [id, advisoryId, entryId, image, services, serviceKind, coverage, component, severity, score, priority, status, firstSeen, lastSeen, sources]
      properties:
        id: { type: string }
        advisoryId: { type: string }
        aliases: { type: array, items: { type: string } }
        entryId: { type: string }
        image: { type: string }
        services: { type: array, items: { type: string } }
        serviceKind: { type: string, enum: [web, generic, database, galera, proxy, registry] }
        coverage: { type: string, enum: [sbom, reference, unknown] }
        component: { $ref: "#/components/schemas/VulnComponent" }
        fixedVersions: { type: array, items: { type: string } }
        severity: { type: string, enum: [unknown, low, medium, high, critical] }
        cvss: { type: number }
        kev: { type: boolean }
        epss: { type: number }
        score: { type: integer, minimum: 0, maximum: 100 }
        priority: { type: string, enum: [P1, P2, P3, P4] }
        basis: { type: string }
        status: { type: string, enum: [affected, under_investigation, not_affected, fixed] }
        justification: { type: string }
        statusBy: { type: string }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        sources: { type: array, items: { type: string } }
    VulnStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [affected, under_investigation, not_affected, fixed] }
        justification: { type: string, maxLength: 1024 }
    VulnPlan:
      type: object
      required: [digest, manual, steps, warnings]
      properties:
        digest: { type: string, description: "Approval binds to this digest" }
        manual: { type: boolean, description: "No automated step; approval records the decision" }
        build: { $ref: "#/components/schemas/ImageBuildRequest" }
        buildPlanDigest: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              order: { type: integer }
              title: { type: string }
              detail: { type: string }
        warnings: { type: array, items: { type: string } }
        majorUpgrade: { type: boolean }
    VulnProposal:
      type: object
      required: [id, findingId, advisoryId, entryId, kind, origin, component, rating, plan, validation, decision, status, createdBy, createdAt]
      properties:
        id: { type: string }
        findingId: { type: string }
        advisoryId: { type: string }
        entryId: { type: string }
        kind: { type: string, enum: [patched_rebuild, mitigation, no_op] }
        origin: { type: string, enum: [deterministic, ai] }
        provider: { type: string }
        model: { type: string }
        promptSha256: { type: string }
        responseSha256: { type: string }
        component: { $ref: "#/components/schemas/VulnComponent" }
        targetVersion: { type: string }
        mitigation:
          type: object
          properties:
            setting: { type: string }
            value: { type: string }
            expiresAt: { type: string, format: date-time }
        rating:
          type: object
          required: [benefit, risk, basis]
          properties:
            benefit: { type: string, enum: [none, low, medium, high] }
            risk: { type: string, enum: [low, medium, high] }
            basis: { type: string }
        aiAssessment:
          type: object
          description: What the model said; display only
          properties:
            affected: { type: string }
            benefit: { type: string }
            risk: { type: string }
        rationale: { type: string, description: "Display-only text; never executed or interpolated" }
        plan: { $ref: "#/components/schemas/VulnPlan" }
        validation:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
            errors: { type: array, items: { type: string } }
        decision:
          type: object
          required: [mode, action]
          properties:
            mode: { type: string, enum: [notify_only, approval_required, auto_for_policy] }
            action: { type: string, enum: [notify, await_approval, auto_approve] }
            reasons: { type: array, items: { type: string } }
        status: { type: string, enum: [proposed, awaiting_approval, invalid, approved, declined, failed] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        execution: { type: string }
    VulnFeedState:
      type: object
      required: [name, stale]
      properties:
        name: { type: string }
        etag: { type: string }
        lastModified: { type: string }
        cursor: { type: string, format: date-time }
        lastAttempt: { type: string, format: date-time }
        lastSuccess: { type: string, format: date-time }
        lastError: { type: string, enum: [rate_limited, too_large, malformed, http_status, timeout, transport] }
        failures: { type: integer }
        nextAttempt: { type: string, format: date-time }
        stale: { type: boolean }
        advisories: { type: integer }
    VulnPollReport:
      type: object
      required: [feeds, advisories, findings, newFindings, resolved, unknown]
      properties:
        feeds: { type: array, items: { $ref: "#/components/schemas/VulnFeedState" } }
        advisories: { type: integer }
        findings: { type: integer, description: "Open findings" }
        newFindings: { type: array, items: { type: string } }
        resolved: { type: array, items: { type: string } }
        unknown: { type: array, items: { type: string }, description: "Inventory entries without known components (not covered, not safe)" }
    VulnPolicy:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [notify_only, approval_required, auto_for_policy] }
        provider: { type: string }
        model: { type: string }
        auto:
          type: object
          properties:
            severities: { type: array, items: { type: string, enum: [low, medium, high, critical] } }
            services: { type: array, items: { type: string } }
            kinds: { type: array, items: { type: string, enum: [patched_rebuild, mitigation] } }
            maxPerDay: { type: integer, minimum: 1, maximum: 20 }
        autoOptInBy: { type: string, readOnly: true }
        killSwitch: { type: boolean }
        mitigationDays: { type: integer, minimum: 1, maximum: 90 }
        retainPrompts: { type: boolean }
        updatedBy: { type: string, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    VulnProviderLimits:
      type: object
      properties:
        requestsPerDay: { type: integer, description: "Default 50" }
