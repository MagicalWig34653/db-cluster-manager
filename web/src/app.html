<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>DB Cluster Manager</title>
		<!-- Generated from assets/icon (Icon Composer document); see docs/DESIGN.md "Icon and screenshots". -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			// Apply stored theme/accent before first paint (same keys as src/lib/theme.svelte.ts).
			try {
				var m = localStorage.getItem('theme'), a = localStorage.getItem('accent'), d = document.documentElement;
				if (m === 'dark' || ((m === null || m === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) d.classList.add('dark');
				if (a) d.dataset.accent = a;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
