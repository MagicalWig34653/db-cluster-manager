#
# Single-instance manager for small TEST installations (requirement P07).
# Not highly available. Start:  docker compose -f deploy/compose.yaml up -d
#
# Honest status: without a -config file (none is passed here) the manager runs
# in prototype mode: UI, /api/v1/health, /api/v1/version, no state, no Docker.
# Managed mode (DCM_CONFIG, manager.dataDir under the volume below) ran only as
# a process on lab VMs; this file with such a config was never run.
name: dbcm
services:
  manager:
    # Override with the tag you built or loaded, e.g. DBCM_IMAGE=ghcr.io/OWNER/db-cluster-manager:0.1.0
    image: ${DBCM_IMAGE:-db-cluster-manager:local}
    # Loopback only by default (P10: UI/API are internal). To expose the UI,
    # put a TLS-terminating reverse proxy in front instead of widening this.
    ports:
      - "${DBCM_BIND:-127.0.0.1}:${DBCM_PORT:-8080}:8080"
    volumes:
      - manager-data:/var/lib/dbcm
    # The Docker socket is intentionally NOT mounted. To let the manager use a
    # Docker/Swarm API, point it at a remote, mutually-authenticated endpoint
    # (see docs/INSTALL.md, "Connecting to a Docker API"; not implemented yet).
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
volumes:
  manager-data:
