# SPDX-License-Identifier: AGPL-3.0-only
#
# Managed-mode manager as a Swarm stack: ONE replica, pinned to one Swarm
# manager node (requirements P04, P07). NOT highly available.
#
# !!! HONEST STATUS !!!
# Ran once on a three-VM lab Swarm (arm64, Docker 29.9.2) from an image built
# with deploy/Dockerfile and a `manager init` configuration (lab E7,
# tests/p0/results/e7-stack-deploy.md): deploy, UI, authentication, agents,
# a Galera create, container kill, forced update and drain of the pinned node.
# Never run on the user's Swarm; replicas above 1 are not supported.
#
# Prerequisites (docs/INSTALL.md, "Managed mode as a Swarm stack"):
#   manager init -rp-id <ui host> -manager-addr <node IP> -out manager.json
#   docker config create dbcm-manager-config-1 manager.json
#   plus the secrets, network and host directories the init output lists.
# Deploy on a Swarm manager node:
#   DBCM_MANAGER_NODE=<node hostname> DBCM_DOCKER_GID=$(stat -c %g /var/run/docker.sock) \
#   DBCM_CONFIG_NAME=dbcm-manager-config-1 docker stack deploy -c deploy/stack.yaml dbcm
#
# Docker API access: the manager talks to the local Swarm through the Docker
# socket (the Docker client has no TLS yet; ADR 0014). Socket access is
# root-equivalent on that node. Constraints: the task runs only on the named
# Swarm manager node, as uid 65532 with the socket's group as primary group
# (DBCM_DOCKER_GID), all capabilities dropped and a read-only root filesystem.
#
# Networking: host network (as in lab E4). The UI/API listens on
# 127.0.0.1:${DBCM_PORT} only: put a TLS reverse proxy on that node in front
# (passkeys need an https origin). The metastore binds 127.0.0.1:7445 and the
# agent enrollment endpoint (TLS) the address in manager.agentTransport.
#
# Data: the local volume "manager-data" exists only on the pinned node; the
# data key (manager.keyFile, default <dataDir>/data.key) lives in it. Moving
# the service to another node starts an EMPTY installation, hence the pin.
#
# Three-replica HA variant: deploy/stack-ha.yaml (ran on a three-manager lab
# Swarm in E9): one service per replica (manager-1..3), each pinned to its own
# manager node with its own config (manager init -node-id manager-N -peers
# ...), keyring and peer TLS secrets; see docs/INSTALL.md ("Three-replica HA
# stack"). Do not
# raise "replicas" here: Swarm replicas share one config and have no stable
# identity, and only the metastore leader serves the API.
version: "3.9"
services:
  manager:
    image: ${DBCM_IMAGE:-db-cluster-manager:local}
    command: ["-listen", "127.0.0.1:${DBCM_PORT:-8080}"]
    environment:
      DCM_CONFIG: /etc/dbcm/manager.json
    networks:
      - hostnet
    configs:
      - source: manager-config
        target: /etc/dbcm/manager.json
        uid: "65532"
        gid: "65532"
        mode: 0440
    # Uncomment when the config has manager.backup (manager init -backup);
    # set DBCM_BACKEND_SECRET to the backend secret's name. Uncomment the
    # top-level "secrets:" block at the end of this file as well.
    # secrets:
    #   - source: backend
    #     target: dbcm-backend.json
    #     uid: "65532"
    #     gid: "65532"
    #     mode: 0400
    volumes:
      - manager-data:/var/lib/dbcm
      # Root-equivalent on this node; see the header and ADR 0014.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: tmpfs
        target: /tmp
    read_only: true
    user: "65532:${DBCM_DOCKER_GID:?set DBCM_DOCKER_GID to the group of /var/run/docker.sock}"
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/usr/local/bin/manager", "-healthcheck", "-listen", "127.0.0.1:${DBCM_PORT:-8080}"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == ${DBCM_MANAGER_NODE:?set DBCM_MANAGER_NODE to the hostname of the manager node}
      update_config:
        parallelism: 1
        # stop-first: two tasks must never open the same metastore volume.
        order: stop-first
        failure_action: rollback
        delay: 15s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
networks:
  hostnet:
    external: true
    name: host
configs:
  manager-config:
    external: true
    name: ${DBCM_CONFIG_NAME:?set DBCM_CONFIG_NAME to the Swarm config holding manager.json}
# secrets:
#   backend:
#     external: true
#     name: ${DBCM_BACKEND_SECRET:?set DBCM_BACKEND_SECRET}
volumes:
  manager-data:
    driver: local
