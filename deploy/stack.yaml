#
# Three-replica manager as a Swarm service (P04, P07).
# Deploy on a Swarm manager node:  docker stack deploy -c deploy/stack.yaml dbcm
#
# !!! HONEST STATUS !!!
# Manager HA needs a replicated metastore (Raft). The metastore exists as a
# library and the lab daemon cmd/metad (flags: -id, -bind, -advertise, -data,
# -peers id=host:port,..., -bootstrap), but the manager does NOT embed it yet
# and has no peers configuration. Running three replicas of the current
# manager gives three independent, stateless UI/API instances, NOT a highly
# available manager. Once the manager embeds the metastore, each replica needs
# a stable node ID and the peer list, for example (proposal, not implemented):
#   -id mgr-1 -bind 0.0.0.0:7000 -advertise tasks.manager:7000
#   -peers mgr-1=<addr>:7000,mgr-2=<addr>:7000,mgr-3=<addr>:7000
# Swarm replicas are interchangeable tasks and do not get stable IDs or
# per-replica volumes from "replicas: 3"; the final HA layout (e.g. three
# pinned services, one per node, each with its own local volume) is still to
# be designed. Do not treat this file as an HA deployment.
version: "3.9"
services:
  manager:
    image: ${DBCM_IMAGE:-db-cluster-manager:local}
    networks:
      - dbcm-internal
    # No published port by default (internal only). Add a TLS reverse proxy on
    # the same overlay network, or publish deliberately:
    #   ports: [{target: 8080, published: 8080, mode: host}]
    volumes:
      # Local volume: each node creates its own instance of this volume.
      - manager-data:/var/lib/dbcm
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/manager", "-healthcheck", "-listen", "0.0.0.0:8080"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      mode: replicated
      replicas: 3
      placement:
        max_replicas_per_node: 1
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 15s
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
networks:
  dbcm-internal:
    driver: overlay
    attachable: false
    driver_opts:
      encrypted: "true"
volumes:
  manager-data:
    driver: local
