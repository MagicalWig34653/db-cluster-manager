# Generated by cluster-manager (imagecompose). Change the recipe, not this file.
ServerRoot "/etc/dbcm/apache"
PidFile "/tmp/httpd.pid"
DefaultRuntimeDir /tmp
Listen 8080
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule log_config_module /usr/lib/apache2/modules/mod_log_config.so
LoadModule unixd_module /usr/lib/apache2/modules/mod_unixd.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule filter_module /usr/lib/apache2/modules/mod_filter.so
LoadModule deflate_module /usr/lib/apache2/modules/mod_deflate.so
LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_fcgi_module /usr/lib/apache2/modules/mod_proxy_fcgi.so
ServerName example.org
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 60
KeepAlive On
KeepAliveTimeout 5
LimitRequestBody 1048576
TypesConfig /etc/mime.types
ErrorLog /dev/stderr
LogLevel warn
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /dev/stdout common
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Strict-Transport-Security "max-age=31536000"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
AddOutputFilterByType DEFLATE text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml
DocumentRoot "/var/www/html"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/var/www/html">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php index.html
    FallbackResource /index.php
</Directory>
<LocationMatch "/\.(?!well-known)">
    Require all denied
</LocationMatch>
ProxyTimeout 60
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:9000"
</FilesMatch>
