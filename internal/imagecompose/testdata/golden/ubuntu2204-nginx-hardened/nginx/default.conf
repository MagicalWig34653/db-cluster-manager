# Generated by cluster-manager (imagecompose). Change the recipe, not this file.
server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    limit_req zone=dbcm_perip burst=30 nodelay;
    location = /dbcm-ping {
        access_log off;
        allow 127.0.0.1;
        deny all;
        limit_req off;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /dbcm-ping;
        fastcgi_param SCRIPT_NAME /dbcm-ping;
        fastcgi_pass 127.0.0.1:9000;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $dbcm_https if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
}
