; Generated by cluster-manager (imagecompose). Change the recipe, not this file.
; Fixed hardening lines (not configurable):
allow_url_include = Off
cgi.fix_pathinfo = 0
log_errors = On
error_log = /proc/self/fd/2
session.save_path = /tmp
upload_tmp_dir = /tmp
; Settings from the recipe:
memory_limit = 128M
upload_max_filesize = 2M
post_max_size = 8M
max_execution_time = 30
max_input_vars = 1000
max_file_uploads = 20
realpath_cache_size = 4096K
date.timezone = UTC
display_errors = Off
expose_php = Off
