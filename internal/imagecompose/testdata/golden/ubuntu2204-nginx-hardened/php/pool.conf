[www]
listen = 127.0.0.1:9000
clear_env = yes
catch_workers_output = yes
pm = dynamic
pm.max_children = 10
pm.max_requests = 500
request_terminate_timeout = 60s
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
ping.path = /dbcm-ping
ping.response = pong
